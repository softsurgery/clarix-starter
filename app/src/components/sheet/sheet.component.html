<hlm-sheet-content
  sheetContentBridge
  class="sheet-panel"
  [attr.data-side]="context.position ?? 'right'"
  [showCloseButton]="false"
  [style.width]="context.width"
  [style.max-width]="context.width"
>
  <button
    hlmBtn
    variant="ghost"
    size="icon-sm"
    class="absolute top-4 z-10"
    [class.start-4]="context.position === 'left'"
    [class.end-4]="context.position !== 'left'"
    hlmSheetClose
    aria-label="Close"
  >
    <ng-icon hlm size="sm" name="lucideX" />
  </button>

  <hlm-sheet-header>
    <h1 hlmSheetTitle class="text-xl font-bold">{{ context.title }}</h1>
    <p hlmSheetDescription>{{ context.description }}</p>
  </hlm-sheet-header>

  @if (context.component) {
    <div class="flex-1 overflow-y-auto px-4">
      <ng-container
        [ngComponentOutlet]="context.component.outlet"
        [ngComponentOutletInputs]="context.component.props"
      />
    </div>
  }

  @if (actions.length > 0) {
    <hlm-sheet-footer class="flex flex-row justify-end">
      @for (action of actions; track action.label) {
        <button
          hlmBtn
          [variant]="action.variant ?? 'default'"
          [disabled]="isDisabled(action)"
          (click)="onActionClick(action)"
        >
          {{ action.label }}
        </button>
      }
    </hlm-sheet-footer>
  }
</hlm-sheet-content>
