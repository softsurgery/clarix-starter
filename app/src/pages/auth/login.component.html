<div class="grid min-h-svh lg:grid-cols-2 select-none">
  <div class="flex flex-col gap-4 p-6 md:p-10 overflow-auto">
    <div class="flex justify-center gap-2 md:justify-start">
      <div class="flex items-center gap-2 font-medium">
        <img src="assets/images/clarix-icon.png" alt="" class="size-6 rounded-md object-cover" />
        Clarix
      </div>
    </div>

    <div class="flex flex-1 items-center justify-center">
      <div class="w-full max-w-xs">
        <form (ngSubmit)="onLogin()" class="flex flex-col gap-6">
          <div class="flex flex-col items-center gap-2 text-center">
            <h1 class="text-2xl font-bold">Welcome back</h1>
            <p class="text-muted-foreground text-sm text-balance">Sign in to access your account</p>
          </div>

          <div class="grid gap-4">
            <div class="grid gap-2">
              <label hlmLabel>Username</label>
              <input
                hlmInput
                [(ngModel)]="username"
                name="username"
                type="text"
                placeholder="Enter username"
                class="w-full"
                autocomplete="username"
              />
            </div>

            <div class="grid gap-2">
              <label hlmLabel>Password</label>
              <input
                hlmInput
                [(ngModel)]="password"
                name="password"
                type="password"
                placeholder="Enter password"
                class="w-full"
                autocomplete="current-password"
              />
            </div>

            @if (errorMessage) {
              <div
                class="rounded-md border border-destructive/20 bg-destructive/10 px-3 py-2 text-sm text-destructive"
              >
                {{ errorMessage }}
              </div>
            }

            <button hlmBtn type="submit" class="w-full">Start Session</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="relative hidden bg-muted lg:block">
    <img
      src="assets/images/auth-cover.jpg"
      alt=""
      class="absolute inset-0 h-full w-full object-cover grayscale"
      draggable="false"
    />
  </div>
</div>
