<div class="flex flex-col flex-1 overflow-hidden">
  <div class="flex flex-col flex-1 p-6 overflow-auto gap-4">
    @if (testStatus()) {
      <div class="flex flex-col gap-2 rounded border bg-muted/30 p-4">
        <div class="flex items-center gap-2">
          <span class="text-sm font-medium">Connection test</span>
          @if (testStatus()?.startsWith('Connected')) {
            <span hlmBadge variant="default">OK</span>
          } @else {
            <span hlmBadge variant="destructive">Failed</span>
          }
        </div>
        <p class="text-sm text-muted-foreground">{{ testStatus() }}</p>
        @if (testModels().length > 0) {
          <p class="text-sm font-mono break-all">{{ testModels().join(', ') }}</p>
        }
      </div>
    }

    @if (formStructure()) {
      <app-form-builder [structure]="formStructure()!" />
    }
  </div>
</div>
